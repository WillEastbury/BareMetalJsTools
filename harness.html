<script>
(function () {
  window.global = window;
  BareMetal.TestRunner.installGlobals();

  var params = new URLSearchParams(location.search || '');
  var requested = params.get('manifest');
  // Accept legacy ?manifest=ci as an alias for the client smoke subset.
  var manifestName = (requested === 'smoke' || requested === 'ci') ? 'smoke' : 'full';
  var manifestSrc = manifestName === 'smoke'
    ? 'tests/harness-manifest.smoke.js'
    : 'tests/harness-manifest.js';

  var files = [];
  var expected = 0;
  var loaded = 0;
  var loadErrors = [];

  function finish(res) {
    var pre = document.createElement('pre');
    pre.id = 'test-results';
    pre.setAttribute('data-complete', 'true');
    pre.setAttribute('data-passed', String(res.passed));
    pre.setAttribute('data-failed', String(res.failed));
    pre.setAttribute('data-skipped', String(res.skipped || 0));
    pre.setAttribute('data-total', String(res.total || (res.results && res.results.length) || 0));
    pre.setAttribute('data-generation', String(res.runGeneration || 1));
    pre.setAttribute('data-manifest', String(expected));
    pre.setAttribute('data-manifest-name', manifestName);
    pre.setAttribute('data-loaded', String(loaded));
    var fails = (res.results || []).filter(function (x) { return x.status === 'failed'; }).map(function (x) {
      return x.name + ': ' + (x.error && x.error.message || x.error);
    });
    pre.setAttribute('data-fails', fails.join(' || '));
    pre.textContent = 'passed=' + res.passed + ' failed=' + res.failed + (fails.length ? '\n' + fails.join('\n') : '');
    document.getElementById('results').appendChild(pre);
  }

  function startRun() {
    if (loaded !== expected || loadErrors.length) {
      finish({
        passed: 0,
        failed: 1,
        skipped: 0,
        total: 1,
        runGeneration: 1,
        results: []
      });
      document.getElementById('test-results').textContent +=
        ' manifest-error loaded=' + loaded + '/' + expected + ' ' + loadErrors.join(',');
      return;
    }
    window.__bmHarness = BareMetal.TestRunner.run().then(function (res) {
      finish(res);
      return res;
    }).catch(function (e) {
      document.getElementById('results').textContent = 'ERROR: ' + e;
      throw e;
    });
  }

  function next(i) {
    if (i >= files.length) { startRun(); return; }
    var s = document.createElement('script');
    s.src = files[i];
    s.onload = function () { loaded++; next(i + 1); };
    s.onerror = function () { loadErrors.push(files[i]); next(i + 1); };
    document.head.appendChild(s);
  }

  function loadManifest() {
    var s = document.createElement('script');
    s.src = manifestSrc;
    s.onload = function () {
      files = window.BM_TEST_FILES || [];
      expected = window.BM_TEST_FILE_COUNT || files.length;
      next(0);
    };
    s.onerror = function () {
      finish({
        passed: 0,
        failed: 1,
        skipped: 0,
        total: 1,
        runGeneration: 1,
        results: [{ status: 'failed', name: 'manifest', error: 'failed to load ' + manifestSrc }]
      });
    };
    document.head.appendChild(s);
  }

  loadManifest();
})();
</script>
